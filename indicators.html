<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bauhaus Interactive Expanding Orbits</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <canvas id="bauhausCanvas"></canvas>

  <script>
    const canvas = document.getElementById('bauhausCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    const baseCenterRadius = 55;
    
    // Mouse tracking & expansion target values
    const mouse = { x: -1000, y: -1000, active: false };
    let expansionFactor = 0; // Smooth transition value (0 = normal, 1 = fully widened)

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Track mouse movement
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    window.addEventListener('mouseleave', () => {
      mouse.active = false;
    });

    // Dust-like Ant Particle
    class DustAnt {
      constructor(ringIndex) {
        this.ringIndex = ringIndex;
        this.baseSpacing = 28;
        this.angle = Math.random() * Math.PI * 2;
        
        const direction = ringIndex % 2 === 0 ? 1 : -1;
        this.speed = (0.003 + Math.random() * 0.002) * direction;
        
        this.size = 0.9 + Math.random() * 0.8;
        this.opacity = 0.65 + Math.random() * 0.35;
      }

      getCurrentRadius(currentExpansion) {
        // Base distance vs widened distance per concentric ring
        const baseR = baseCenterRadius + 30 + this.ringIndex * this.baseSpacing;
        const widenedR = baseCenterRadius + 45 + this.ringIndex * (this.baseSpacing + 22);
        return baseR + (widenedR - baseR) * currentExpansion;
      }

      update() {
        this.angle += this.speed;
      }

      draw(currentExpansion) {
        const radius = this.getCurrentRadius(currentExpansion);
        const x = centerX + Math.cos(this.angle) * radius;
        const y = centerY + Math.sin(this.angle) * radius;

        const heading = this.angle + (this.speed > 0 ? Math.PI / 2 : -Math.PI / 2);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);
        ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;

        const s = this.size;
        ctx.beginPath();
        ctx.arc(-s * 1.1, 0, s, 0, Math.PI * 2);
        ctx.arc(s * 1.1, 0, s * 0.75, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Population Setup
    const totalRings = 12;
    const ants = [];

    for (let r = 0; r < totalRings; r++) {
      const antsInRing = 18 + r * 14;
      for (let i = 0; i < antsInRing; i++) {
        ants.push(new DustAnt(r));
      }
    }

    // Main Render Loop
    function render() {
      // Calculate mouse proximity to center circle
      const dx = mouse.x - centerX;
      const dy = mouse.y - centerY;
      const mouseDist = Math.sqrt(dx * dx + dy * dy);
      
      // Target expansion triggers when mouse drifts near or inside outer rings (< 450px radius)
      const maxProximity = 450;
      let targetExpansion = 0;
      
      if (mouse.active && mouseDist < maxProximity) {
        // Smooth scaling effect based on how close the cursor is to the center
        targetExpansion = 1 - (mouseDist / maxProximity);
        targetExpansion = Math.pow(targetExpansion, 0.8); // Curved response curve
      }

      // Smooth easing (Lerp) towards the target expansion
      expansionFactor += (targetExpansion - expansionFactor) * 0.08;

      // Clear Canvas
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // Dynamic central black circle radius (expands slightly when drifting near)
      const currentCenterRadius = baseCenterRadius + (expansionFactor * 12);

      // 1. Draw Widening Concentric Ring Lines
      ctx.lineWidth = 1;
      for (let r = 0; r < totalRings; r++) {
        const baseR = baseCenterRadius + 30 + r * 28;
        const widenedR = baseCenterRadius + 45 + r * (28 + 22);
        const currentR = baseR + (widenedR - baseR) * expansionFactor;

        ctx.beginPath();
        ctx.arc(centerX, centerY, currentR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 0, 0, ${0.06 + expansionFactor * 0.04})`;
        ctx.stroke();
      }

      // 2. Draw Dust Ants on Widening Paths
      ants.forEach(ant => {
        ant.update();
        ant.draw(expansionFactor);
      });

      // 3. Focal Center Black Circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentCenterRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
