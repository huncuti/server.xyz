<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Walking Circle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    canvas {
      width: min(90vw, 900px);
      height: min(90vw, 900px);
      display: block;
      cursor: none;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let cx = 0;
let cy = 0;

const mouse = {
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0
};

let rotation = 0;
let targetRotation = 0;

const people = [];

/*
  Create people around the circle.
*/
const PEOPLE_COUNT = 22;

for (let i = 0; i < PEOPLE_COUNT; i++) {
  people.push({
    angle: (Math.PI * 2 / PEOPLE_COUNT) * i,
    speed: 0.002 + Math.random() * 0.0015,
    size: 0.75 + Math.random() * 0.45,
    offset: Math.random() * 1000,
    direction: Math.random() > 0.5 ? 1 : -1
  });
}


/* -----------------------------
   Resize
----------------------------- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const size = Math.min(
    window.innerWidth * 0.9,
    window.innerHeight * 0.9,
    900
  );

  canvas.style.width = size + "px";
  canvas.style.height = size + "px";

  canvas.width = size * dpr;
  canvas.height = size * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = size;
  H = size;

  cx = W / 2;
  cy = H / 2;
}

window.addEventListener("resize", resize);
resize();


/* -----------------------------
   Mouse
----------------------------- */

window.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();

  mouse.targetX =
    (e.clientX - rect.left) / rect.width - 0.5;

  mouse.targetY =
    (e.clientY - rect.top) / rect.height - 0.5;
});


/* -----------------------------
   Draw person
----------------------------- */

function drawPerson(person, x, y, scale, alpha, walking) {

  ctx.save();

  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  ctx.strokeStyle = "#000";

  /*
    Walking animation.
  */
  const t =
    performance.now() * 0.008 * person.direction +
    person.offset;

  const step = Math.sin(t) * 7;
  const step2 = Math.sin(t + Math.PI) * 7;

  /*
    Body
  */
  ctx.beginPath();
  ctx.ellipse(0, -30, 10, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  /*
    Torso
  */
  ctx.beginPath();
  ctx.roundRect(-9, -18, 18, 34, 5);
  ctx.fill();

  /*
    Arms
  */
  ctx.lineWidth = 5;
  ctx.lineCap = "round";

  ctx.beginPath();

  ctx.moveTo(-7, -12);
  ctx.lineTo(-15, 2 + step * 0.35);

  ctx.moveTo(7, -12);
  ctx.lineTo(15, 2 + step2 * 0.35);

  ctx.stroke();

  /*
    Legs
  */
  ctx.lineWidth = 7;

  ctx.beginPath();

  ctx.moveTo(-5, 15);
  ctx.lineTo(-8 + step, 39);

  ctx.moveTo(5, 15);
  ctx.lineTo(8 + step2, 39);

  ctx.stroke();

  /*
    Feet
  */
  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(-8 + step, 39);
  ctx.lineTo(-15 + step, 39);

  ctx.moveTo(8 + step2, 39);
  ctx.lineTo(15 + step2, 39);

  ctx.stroke();

  ctx.restore();
}


/* -----------------------------
   Main animation
----------------------------- */

function animate(time) {

  requestAnimationFrame(animate);

  /*
    Smooth mouse movement.
  */
  mouse.x += (mouse.targetX - mouse.x) * 0.06;
  mouse.y += (mouse.targetY - mouse.y) * 0.06;

  /*
    Mouse controls rotation.
  */
  targetRotation =
    mouse.x * Math.PI * 0.8;

  rotation +=
    (targetRotation - rotation) * 0.04;

  /*
    Background
  */
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);


  /*
    Circle dimensions.
  */
  const radius =
    Math.min(W, H) * 0.34;

  /*
    Central black dot.
  */
  const dotSize =
    Math.min(W, H) * 0.035;

  ctx.beginPath();
  ctx.arc(
    cx,
    cy,
    dotSize,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#000";
  ctx.fill();


  /*
    Calculate people positions.

    We fake depth using sin(angle):
    people at the front are larger,
    people at the back are smaller.
  */
  const renderedPeople = people
    .map(person => {

      const angle =
        person.angle +
        rotation +
        time * person.speed * person.direction;

      const depth =
        Math.sin(angle);

      const x =
        cx +
        Math.cos(angle) * radius;

      const y =
        cy +
        Math.sin(angle) *
        radius *
        0.42;

      /*
        Perspective scale.
      */
      const perspective =
        0.55 + (depth + 1) * 0.28;

      /*
        Back people become lighter.
      */
      const alpha =
        0.35 + (depth + 1) * 0.32;

      return {
        person,
        x,
        y,
        scale: perspective * person.size,
        alpha,
        depth
      };
    })
    /*
      Sort by depth so people in front
      render over people in the back.
    */
    .sort((a, b) => a.depth - b.depth);


  /*
    Draw people.
  */
  renderedPeople.forEach(p => {

    drawPerson(
      p.person,
      p.x,
      p.y,
      p.scale,
      p.alpha,
      true
    );

  });


  /*
    Draw the central dot again so it
    always stays visually dominant.
  */
  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    dotSize,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#000";
  ctx.fill();
}

requestAnimationFrame(animate);
</script>

</body>
</html>
