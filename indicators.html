<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* Centered Text Overlay inside the Black Circle */
    .hero-title-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
      color: #ffffff;
      z-index: 10;
      white-space: nowrap;
      user-select: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .hero-title-container.visible {
      opacity: 1;
    }

    .name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <!-- Center Circle Hover Title -->
  <div class="hero-title-container" id="titleContainer">
    <div class="name">LARA PETROVIĆ</div>
    <div class="subtitle">PORTFOLIO</div>
  </div>

  <canvas id="bauhausCanvas"></canvas>

  <script>
    const canvas = document.getElementById('bauhausCanvas');
    const ctx = canvas.getContext('2d');
    const titleContainer = document.getElementById('titleContainer');

    let width, height, centerX, centerY;
    const baseCenterRadius = 90;
    
    // Mouse tracking & expansion state
    const mouse = { x: -1000, y: -1000, active: false };
    let expansionFactor = 0; // 0 = default, 1 = fully expanded across screen

    // Section Nav Config mapped to every 2nd concentric ring
    const navSections = [
      { label: "ABOUT", ringIndex: 2, angle: -Math.PI * 0.75, url: "#about" },
      { label: "RESEARCH", ringIndex: 4, angle: -Math.PI * 0.25, url: "#research" },
      { label: "ART", ringIndex: 6, angle: Math.PI * 0.25, url: "#art" },
      { label: "CONTACT", ringIndex: 8, angle: Math.PI * 0.75, url: "#contact" }
    ];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Track mouse
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    window.addEventListener('mouseleave', () => {
      mouse.active = false;
    });

    // Handle clicks on curved text links
    canvas.addEventListener('click', (e) => {
      if (expansionFactor < 0.9) return;
      
      navSections.forEach(sec => {
        const radius = getRingRadius(sec.ringIndex, expansionFactor);
        const px = centerX + Math.cos(sec.angle) * radius;
        const py = centerY + Math.sin(sec.angle) * radius;
        const dist = Math.hypot(e.clientX - px, e.clientY - py);

        if (dist < 40) {
          window.location.hash = sec.url;
        }
      });
    });

    // Dynamic ring spacing to fit the entire screen upon full expansion
    function getRingRadius(ringIndex, expansion) {
      const maxScreenRadius = Math.hypot(centerX, centerY);
      const totalRings = 10;
      
      // Default rest radius spacing vs screen-filling expansion spacing
      const baseR = baseCenterRadius + 25 + ringIndex * 22;
      const targetR = baseCenterRadius + 30 + (ringIndex / totalRings) * (maxScreenRadius - baseCenterRadius - 50);
      
      return baseR + (targetR - baseR) * expansion;
    }

    // Dust-like Ant Particle
    class DustAnt {
      constructor(ringIndex) {
        this.ringIndex = ringIndex;
        this.angle = Math.random() * Math.PI * 2;
        
        const direction = ringIndex % 2 === 0 ? 1 : -1;
        this.speed = (0.003 + Math.random() * 0.002) * direction;
        
        this.size = 0.9 + Math.random() * 0.8;
        this.opacity = 0.65 + Math.random() * 0.35;
      }

      update() {
        this.angle += this.speed;
      }

      draw(currentExpansion) {
        const radius = getRingRadius(this.ringIndex, currentExpansion);
        const x = centerX + Math.cos(this.angle) * radius;
        const y = centerY + Math.sin(this.angle) * radius;

        const heading = this.angle + (this.speed > 0 ? Math.PI / 2 : -Math.PI / 2);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);
        ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;

        const s = this.size;
        ctx.beginPath();
        ctx.arc(-s * 1.1, 0, s, 0, Math.PI * 2);
        ctx.arc(s * 1.1, 0, s * 0.75, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Ant Population
    const totalRings = 10;
    const ants = [];

    for (let r = 0; r < totalRings; r++) {
      const antsInRing = 20 + r * 16;
      for (let i = 0; i < antsInRing; i++) {
        ants.push(new DustAnt(r));
      }
    }

    // Helper: Render Curved Text along Circle Arcs
    function drawCurvedText(text, radius, centerAngle, opacity) {
      ctx.save();
      ctx.font = "700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const letterSpacing = 0.035; // Angle gap per character relative to radius
      const totalAngle = text.length * letterSpacing;
      let startAngle = centerAngle - totalAngle / 2;

      for (let i = 0; i < text.length; i++) {
        const charAngle = startAngle + i * letterSpacing;
        const x = centerX + Math.cos(charAngle) * radius;
        const y = centerY + Math.sin(charAngle) * radius;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(charAngle + Math.PI / 2);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    // Main Animation Loop
    function render() {
      // Calculate cursor distance to center circle
      const dx = mouse.x - centerX;
      const dy = mouse.y - centerY;
      const mouseDist = Math.hypot(dx, dy);
      
      const maxProximity = 500;
      let targetExpansion = 0;
      
      if (mouse.active && mouseDist < maxProximity) {
        targetExpansion = 1 - (mouseDist / maxProximity);
        targetExpansion = Math.pow(targetExpansion, 0.7);
      }

      // Smooth easing (Lerp) towards screen-filling expansion
      expansionFactor += (targetExpansion - expansionFactor) * 0.07;

      const currentCenterRadius = baseCenterRadius + (expansionFactor * 14);

      // Toggle Hover Title Visibility inside Center Circle
      if (mouse.active && mouseDist <= currentCenterRadius && expansionFactor < 0.8) {
        titleContainer.classList.add('visible');
      } else {
        titleContainer.classList.remove('visible');
      }

      // Clear Canvas
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      const textScale = 1 + expansionFactor * 0.08;
      titleContainer.style.transform = `translate(-50%, -50%) scale(${textScale})`;

      // 1. Draw Concentric Guide Rings
      ctx.lineWidth = 1;
      for (let r = 0; r < totalRings; r++) {
        const currentR = getRingRadius(r, expansionFactor);
        ctx.beginPath();
        ctx.arc(centerX, centerY, currentR, 0, Math.PI * 2);
        
        const isTextRing = navSections.some(sec => sec.ringIndex === r);
        ctx.strokeStyle = isTextRing 
          ? `rgba(0, 0, 0, ${0.1 + expansionFactor * 0.15})`
          : `rgba(0, 0, 0, ${0.05 + expansionFactor * 0.04})`;
        ctx.stroke();
      }

      // 2. Draw Moving Ants in Background
      ants.forEach(ant => {
        ant.update();
        ant.draw(expansionFactor);
      });

      // 3. Draw Curved Section Text ONLY when almost fully expanded (> 85%)
      if (expansionFactor > 0.85) {
        // Fade in smoothly as expansion reaches 1.0
        const textOpacity = Math.min(1, (expansionFactor - 0.85) / 0.15);
        
        navSections.forEach(sec => {
          const radius = getRingRadius(sec.ringIndex, expansionFactor);
          drawCurvedText(sec.label, radius, sec.angle, textOpacity);
        });
      }

      // 4. Focal Center Black Circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentCenterRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
