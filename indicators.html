<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* Centered Text Overlay inside the Black Circle */
    .hero-title-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      text-align: center;
      color: #ffffff;
      z-index: 10;
      white-space: nowrap;
      user-select: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .hero-title-container.visible {
      opacity: 1;
    }

    .name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div class="hero-title-container" id="titleContainer">
    <div class="name">LARA PETROVIĆ</div>
    <div class="subtitle">PORTFOLIO</div>
  </div>

  <canvas id="bauhausCanvas"></canvas>

  <script>
    const canvas = document.getElementById('bauhausCanvas');
    const ctx = canvas.getContext('2d');
    const titleContainer = document.getElementById('titleContainer');

    let width, height, centerX, centerY;
    const baseCenterRadius = 105; // Enlarged to fit text elegantly
    
    // Mouse tracking & expansion target values
    const mouse = { x: -1000, y: -1000, active: false };
    let expansionFactor = 0; // Smooth transition value (0 = normal, 1 = fully widened)

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Track mouse movement
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    window.addEventListener('mouseleave', () => {
      mouse.active = false;
    });

    // Dust-like Ant Particle
    class DustAnt {
      constructor(ringIndex) {
        this.ringIndex = ringIndex;
        this.baseSpacing = 26;
        this.angle = Math.random() * Math.PI * 2;
        
        const direction = ringIndex % 2 === 0 ? 1 : -1;
        this.speed = (0.003 + Math.random() * 0.002) * direction;
        
        this.size = 0.9 + Math.random() * 0.8;
        this.opacity = 0.65 + Math.random() * 0.35;
      }

      getCurrentRadius(currentExpansion) {
        const baseR = baseCenterRadius + 30 + this.ringIndex * this.baseSpacing;
        const widenedR = baseCenterRadius + 50 + this.ringIndex * (this.baseSpacing + 22);
        return baseR + (widenedR - baseR) * currentExpansion;
      }

      update() {
        this.angle += this.speed;
      }

      draw(currentExpansion) {
        const radius = this.getCurrentRadius(currentExpansion);
        const x = centerX + Math.cos(this.angle) * radius;
        const y = centerY + Math.sin(this.angle) * radius;

        const heading = this.angle + (this.speed > 0 ? Math.PI / 2 : -Math.PI / 2);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);
        ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;

        const s = this.size;
        ctx.beginPath();
        ctx.arc(-s * 1.1, 0, s, 0, Math.PI * 2);
        ctx.arc(s * 1.1, 0, s * 0.75, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Population Setup
    const totalRings = 12;
    const ants = [];

    for (let r = 0; r < totalRings; r++) {
      const antsInRing = 22 + r * 14;
      for (let i = 0; i < antsInRing; i++) {
        ants.push(new DustAnt(r));
      }
    }

    // Main Render Loop
    function render() {
      // Calculate mouse proximity to center circle
      const dx = mouse.x - centerX;
      const dy = mouse.y - centerY;
      const mouseDist = Math.sqrt(dx * dx + dy * dy);
      
      const maxProximity = 500;
      let targetExpansion = 0;
      
      if (mouse.active && mouseDist < maxProximity) {
        targetExpansion = 1 - (mouseDist / maxProximity);
        targetExpansion = Math.pow(targetExpansion, 0.8);
      }

      // Smooth easing (Lerp) towards the target expansion
      expansionFactor += (targetExpansion - expansionFactor) * 0.08;

      // Dynamic central black circle radius
      const currentCenterRadius = baseCenterRadius + (expansionFactor * 16);

      // Check if mouse is over/inside the black circle
      if (mouse.active && mouseDist <= currentCenterRadius) {
        titleContainer.classList.add('visible');
      } else {
        titleContainer.classList.remove('visible');
      }

      // Clear Canvas
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // Subtle scaling of text container to match circle expansion
      const textScale = 1 + expansionFactor * 0.08;
      titleContainer.style.transform = `translate(-50%, -50%) scale(${textScale})`;

      // 1. Draw Widening Concentric Ring Lines
      ctx.lineWidth = 1;
      for (let r = 0; r < totalRings; r++) {
        const baseR = baseCenterRadius + 30 + r * 26;
        const widenedR = baseCenterRadius + 50 + r * (26 + 22);
        const currentR = baseR + (widenedR - baseR) * expansionFactor;

        ctx.beginPath();
        ctx.arc(centerX, centerY, currentR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 0, 0, ${0.06 + expansionFactor * 0.04})`;
        ctx.stroke();
      }

      // 2. Draw Dust Ants on Widening Paths
      ants.forEach(ant => {
        ant.update();
        ant.draw(expansionFactor);
      });

      // 3. Focal Center Black Circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentCenterRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
