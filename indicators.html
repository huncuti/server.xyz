<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>lara petrovic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .name {
      position: fixed;
      top: 24px;
      left: 28px;

      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: -0.02em;

      z-index: 10;
      pointer-events: none;
    }

    canvas {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
      cursor: none;
    }
  </style>
</head>

<body>

  <div class="name">lara petrovic</div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let W;
    let H;
    let cx;
    let cy;

    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0
    };

    let rotation = 0;
    let targetRotation = 0;

    const people = [];

    const PEOPLE_COUNT = 24;

    for (let i = 0; i < PEOPLE_COUNT; i++) {
      people.push({
        angle: (Math.PI * 2 / PEOPLE_COUNT) * i,
        speed: 0.0004 + Math.random() * 0.0005,
        size: 0.75 + Math.random() * 0.35,
        offset: Math.random() * 1000,
        direction: Math.random() > 0.5 ? 1 : -1
      });
    }


    // -------------------------
    // Resize
    // -------------------------

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width = W * dpr;
      canvas.height = H * dpr;

      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cx = W / 2;
      cy = H / 2;
    }

    window.addEventListener("resize", resize);

    resize();


    // -------------------------
    // Mouse
    // -------------------------

    window.addEventListener("mousemove", (event) => {
      mouse.targetX =
        event.clientX / window.innerWidth - 0.5;

      mouse.targetY =
        event.clientY / window.innerHeight - 0.5;
    });


    // -------------------------
    // Person
    // -------------------------

    function drawPerson(person, x, y, scale, alpha) {

      ctx.save();

      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#fff";

      const t =
        performance.now() * 0.004 * person.direction +
        person.offset;

      const step = Math.sin(t) * 6;
      const step2 = Math.sin(t + Math.PI) * 6;


      // Head

      ctx.beginPath();

      ctx.arc(
        0,
        -30,
        8,
        0,
        Math.PI * 2
      );

      ctx.fill();


      // Body

      ctx.beginPath();

      ctx.roundRect(
        -8,
        -20,
        16,
        34,
        5
      );

      ctx.fill();


      // Arms

      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      ctx.beginPath();

      ctx.moveTo(-6, -12);
      ctx.lineTo(-14, 2 + step * 0.3);

      ctx.moveTo(6, -12);
      ctx.lineTo(14, 2 + step2 * 0.3);

      ctx.stroke();


      // Legs

      ctx.lineWidth = 6;

      ctx.beginPath();

      ctx.moveTo(-4, 13);
      ctx.lineTo(-7 + step, 38);

      ctx.moveTo(4, 13);
      ctx.lineTo(7 + step2, 38);

      ctx.stroke();


      // Feet

      ctx.lineWidth = 4;

      ctx.beginPath();

      ctx.moveTo(-7 + step, 38);
      ctx.lineTo(-14 + step, 38);

      ctx.moveTo(7 + step2, 38);
      ctx.lineTo(14 + step2, 38);

      ctx.stroke();

      ctx.restore();
    }


    // -------------------------
    // Animation
    // -------------------------

    function animate(time) {

      requestAnimationFrame(animate);

      // Smooth mouse

      mouse.x +=
        (mouse.targetX - mouse.x) * 0.05;

      mouse.y +=
        (mouse.targetY - mouse.y) * 0.05;


      // Mouse controls rotation

      targetRotation =
        mouse.x * Math.PI * 0.7;

      rotation +=
        (targetRotation - rotation) * 0.035;


      // Black background

      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = "#000";

      ctx.fillRect(
        0,
        0,
        W,
        H
      );


      // Circle

      const radius =
        Math.min(W, H) * 0.34;


      // People

      const renderedPeople = people
        .map(person => {

          const angle =
            person.angle +
            rotation +
            time * person.speed * person.direction;

          const depth =
            Math.sin(angle);


          const x =
            cx +
            Math.cos(angle) * radius;


          const y =
            cy +
            Math.sin(angle) *
            radius *
            0.42;


          // Perspective

          const perspective =
            0.45 +
            (depth + 1) * 0.35;


          const alpha =
            0.35 +
            (depth + 1) * 0.32;


          return {
            person,
            x,
            y,
            scale:
              perspective * person.size,
            alpha,
            depth
          };

        })

        .sort((a, b) =>
          a.depth - b.depth
        );


      // Draw people

      renderedPeople.forEach(p => {

        drawPerson(
          p.person,
          p.x,
          p.y,
          p.scale,
          p.alpha
        );

      });


      // Central black dot

      ctx.beginPath();

      ctx.arc(
        cx,
        cy,
        Math.min(W, H) * 0.018,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#000";

      ctx.fill();
    }


    requestAnimationFrame(animate);

  </script>

</body>
</html>
