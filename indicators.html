<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bauhaus Concentric Ant Orbit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="bauhausCanvas"></canvas>

  <script>
    const canvas = document.getElementById('bauhausCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    const centerRadius = 55; // Focal black circle radius

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Ant particle (Dust-like micro scale)
    class DustAnt {
      constructor(ringIndex) {
        this.ringIndex = ringIndex;
        // Concentric radii extending outward from the center circle
        this.radius = centerRadius + 30 + ringIndex * 28;
        this.angle = Math.random() * Math.PI * 2;
        
        // Alternating directions per ring with subtle speed variances
        const direction = ringIndex % 2 === 0 ? 1 : -1;
        this.speed = (0.003 + Math.random() * 0.002) * direction;
        
        // Tiny dust size (1px - 1.8px radius)
        this.size = 0.9 + Math.random() * 0.8; 
        this.opacity = 0.65 + Math.random() * 0.35;
      }

      update() {
        this.angle += this.speed;
      }

      draw() {
        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        // Tangent heading angle along orbit
        const heading = this.angle + (this.speed > 0 ? Math.PI / 2 : -Math.PI / 2);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);
        ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;

        // Abdomen & Head (Micro dust ant shape)
        const s = this.size;
        ctx.beginPath();
        ctx.arc(-s * 1.1, 0, s, 0, Math.PI * 2);
        ctx.arc(s * 1.1, 0, s * 0.75, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Population Setup
    const totalRings = 12;
    const ants = [];

    for (let r = 0; r < totalRings; r++) {
      // Density increases with outer rings
      const antsInRing = 18 + r * 14; 
      for (let i = 0; i < antsInRing; i++) {
        ants.push(new DustAnt(r));
      }
    }

    // Main Draw & Animation Loop
    function render() {
      // Crisp white background clear
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // 1. Faint Concentric Ring Guides (Bauhaus Geometric Precision)
      ctx.lineWidth = 1;
      for (let r = 0; r < totalRings; r++) {
        const ringRadius = centerRadius + 30 + r * 28;
        ctx.beginPath();
        ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.06)';
        ctx.stroke();
      }

      // 2. Tiny Dust Ants
      ants.forEach(ant => {
        ant.update();
        ant.draw();
      });

      // 3. Central Focal Black Circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, centerRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
