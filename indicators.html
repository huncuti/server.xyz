<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concentric Ants with Water Effect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1b2a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }
    .instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div class="instructions">Click or move cursor to trigger water ripples</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    const ripples = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Water Ripple Class
    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.maxRadius = 120 + Math.random() * 80;
        this.opacity = 0.8;
        this.speed = 1.8 + Math.random() * 1.2;
      }

      update() {
        this.radius += this.speed;
        this.opacity = 0.8 * (1 - this.radius / this.maxRadius);
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(135, 206, 250, ${Math.max(0, this.opacity)})`;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Second inner dynamic reflection ring
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0, this.radius - 8), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, this.opacity * 0.4)})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
    }

    // Ant Entity walking along concentric circular orbits
    class Ant {
      constructor(radiusIndex, totalRings) {
        this.radiusIndex = radiusIndex;
        this.radius = 70 + radiusIndex * 45;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = (0.008 + Math.random() * 0.006) * (radiusIndex % 2 === 0 ? 1 : -1);
        this.size = 2.5 + Math.random() * 0.8;
        this.legPhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.angle += this.speed;
        this.legPhase += 0.2;
      }

      draw() {
        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        // Angle tangent to orbit path for realistic alignment
        const heading = this.angle + (this.speed > 0 ? Math.PI / 2 : -Math.PI / 2);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);

        const s = this.size;
        ctx.fillStyle = '#111111';
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 1;

        // Legs (3 pairs)
        const legOffset = Math.sin(this.legPhase) * 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * s * 0.8);
          ctx.lineTo(-s * 2.2 + (i === 0 ? legOffset : -legOffset), i * s * 1.5);
          ctx.moveTo(0, i * s * 0.8);
          ctx.lineTo(s * 2.2 + (i === 0 ? -legOffset : legOffset), i * s * 1.5);
          ctx.stroke();
        }

        // Abdomen
        ctx.beginPath();
        ctx.ellipse(0, -s * 1.8, s * 0.9, s * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Thorax
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
        ctx.fill();

        // Head & Antennae
        ctx.beginPath();
        ctx.arc(0, s * 1.4, s * 0.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-s * 0.3, s * 1.8);
        ctx.lineTo(-s * 1.2, s * 2.8);
        ctx.moveTo(s * 0.3, s * 1.8);
        ctx.lineTo(s * 1.2, s * 2.8);
        ctx.stroke();

        ctx.restore();
      }
    }

    // Setup Concentric Rings & Population
    const ringsCount = 8;
    const ants = [];
    for (let r = 0; r < ringsCount; r++) {
      const count = 6 + r * 5;
      for (let i = 0; i < count; i++) {
        ants.push(new Ant(r, ringsCount));
      }
    }

    // Draw Water Backdrop & Concentric Circles
    function drawBackground() {
      // Subtle radial blue gradient
      const bgGradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, Math.max(width, height) / 2);
      bgGradient.addColorStop(0, '#1b263b');
      bgGradient.addColorStop(1, '#0d1b2a');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, width, height);

      // Render faint concentric guide circles
      ctx.lineWidth = 1;
      for (let r = 0; r < ringsCount; r++) {
        const radius = 70 + r * 45;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.05 + r * 0.01})`;
        ctx.stroke();
      }
    }

    // Trigger Water Ripples on Interaction
    window.addEventListener('click', (e) => {
      ripples.push(new Ripple(e.clientX, e.clientY));
    });

    let throttleTimer = false;
    window.addEventListener('mousemove', (e) => {
      if (!throttleTimer) {
        throttleTimer = true;
        ripples.push(new Ripple(e.clientX, e.clientY));
        setTimeout(() => { throttleTimer = false; }, 120);
      }
    });

    // Main Loop
    function animate() {
      drawBackground();

      // Update & Draw Water Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].update();
        ripples[i].draw();
        if (ripples[i].opacity <= 0) {
          ripples.splice(i, 1);
        }
      }

      // Update & Draw Ants
      ants.forEach(ant => {
        ant.update();
        ant.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
