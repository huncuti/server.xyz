<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
    }

    /* Fullscreen Container */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Animated Canvas Background */
    #peopleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Central Focal Black Dot */
    .center-dot {
      position: relative;
      z-index: 10;
      width: 90px;
      height: 90px;
      background-color: #111111;
      border-radius: 50%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
    }

    .center-dot:hover {
      transform: scale(1.15);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    }

    /* Minimalist Overlay Text */
    .intro-text {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      color: #333333;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.85rem;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <canvas id="peopleCanvas"></canvas>
    <div class="center-dot" title="Enter Portfolio"></div>
    <div class="intro-text">Click to explore portfolio</div>
  </div>

  <script>
    const canvas = document.getElementById('peopleCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Procedural Walking Figure Class
    class Person {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.dir = Math.random() > 0.5 ? 1 : -1;
        this.x = initial ? Math.random() * width : (this.dir === 1 ? -40 : width + 40);
        // Distribute across horizontal planes (depth effect)
        this.depth = Math.random(); // 0 (far) to 1 (near)
        this.y = height * 0.35 + this.depth * (height * 0.35);
        this.scale = 0.5 + this.depth * 0.6;
        this.speed = (0.8 + Math.random() * 1.2) * this.scale * this.dir;
        this.opacity = 0.25 + this.depth * 0.5;
        this.stridePhase = Math.random() * Math.PI * 2;
        this.strideSpeed = 0.08 + Math.random() * 0.04;
        this.heightScale = 50 * this.scale;
      }

      update() {
        this.x += this.speed;
        this.stridePhase += this.strideSpeed;

        if (this.dir === 1 && this.x > width + 50) this.reset();
        if (this.dir === -1 && this.x < -50) this.reset();
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = `rgba(30, 30, 30, ${this.opacity})`;

        const legAngle = Math.sin(this.stridePhase) * 0.45;
        const armAngle = Math.cos(this.stridePhase) * 0.35;
        const h = this.heightScale;

        // Head
        ctx.beginPath();
        ctx.arc(0, -h * 1.05, h * 0.12, 0, Math.PI * 2);
        ctx.fill();

        // Torso
        ctx.beginPath();
        ctx.ellipse(0, -h * 0.6, h * 0.12, h * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        this.drawLimb(0, -h * 0.35, legAngle, h * 0.4, h * 0.06);
        this.drawLimb(0, -h * 0.35, -legAngle, h * 0.4, h * 0.06);

        // Arms
        this.drawLimb(0, -h * 0.8, -armAngle, h * 0.32, h * 0.045);
        this.drawLimb(0, -h * 0.8, armAngle, h * 0.32, h * 0.045);

        ctx.restore();
      }

      drawLimb(x, y, angle, length, width) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.roundRect(-width / 2, 0, width, length, width / 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Initialize People Array
    const peopleCount = 28;
    const people = Array.from({ length: peopleCount }, () => new Person());

    // Main Animation Loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Sort by depth for correct layered rendering
      people.sort((a, b) => a.depth - b.depth);

      people.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
